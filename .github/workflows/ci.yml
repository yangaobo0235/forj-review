name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORJ_TEST_POSTGRES_URL: postgresql://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit and contract tests (no database)
        run: uv run pytest -q tests/unit tests/contracts

      - name: Integration tests (isolated PostgreSQL)
        run: uv run pytest -q tests/integration tests/release

      - name: Run Ruff
        run: uv run ruff check src tests scripts

      # README 和 CONTRIBUTING 都要求提交前跑这一步，之前没有门禁。
      - name: Byte-compile
        run: uv run python -m compileall -q src

      - name: Check architecture
        run: uv run python scripts/ci/check_architecture.py

      - name: Build Python distribution
        run: uv build

  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/review-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: apps/review-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install browser for integration tests
        run: npx playwright install --with-deps chromium

      - name: Browser collection and write-back tests
        run: npm run test:browser

      - name: Build extension
        run: npm run build

      # 发布给用户的是 build:public（见 docs/部署运维.md）。之前 CI 只验证了
      # 开发模式构建，发布路径没有任何门禁。
      - name: Build extension (release)
        run: npm run build:public

      - name: Run ESLint
        run: npm run lint

      - name: Check extension architecture
        run: node ../../scripts/ci/check-extension-architecture.mjs

  configuration-web:
    name: Configuration Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/review-config-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: apps/review-config-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build configuration Web
        run: npm run build

  container:
    name: Production container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: uv sync --locked
      - name: Build production image
        run: docker build --file deploy/Dockerfile --tag forj-review-service:ci .
      - name: Validate deployment Compose
        run: |
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          cp deploy/server/review.env.example "$validation_dir/.env"
          cp deploy/server/database.env.example "$validation_dir/.env.database"
          docker compose --project-directory "$validation_dir" --env-file "$validation_dir/.env" -f deploy/server/docker-compose.server.yml config --quiet
      - name: Verify health and persistent application logs
        run: uv run python scripts/ci/smoke_container.py forj-review-service:ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 最低限度的凭据扫描，不依赖第三方 Action：只查高信号模式，排除示例文件
      # 和锁文件（锁文件里可能有形似的高熵字符串）。更完整的方案是 gitleaks，
      # 接入前需确认许可证要求。
      - name: Smoke-check for committed credentials
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
              -- ':(exclude)*.example' ':(exclude)*.lock' ':(exclude)*.md'; then
            echo "::error::检测到疑似凭据。请改为环境变量或本地 .env（已被 .gitignore 忽略）。"
            exit 1
          fi
          echo "未发现疑似凭据。"
