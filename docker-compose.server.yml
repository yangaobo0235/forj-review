services:
  review-agent:
    container_name: review-agent-service
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: forj-review-api:main
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      # 容器默认 UTC，日志时间戳和按天轮转的切点都会偏 8 小时（切点变成北京
      # 时间早上 8 点）。设成宿主机所在时区，日志才和系统时间对得上。
      TZ: "Asia/Shanghai"
      # 识别侧：单任务 8 让 16 张从 3 波变 2 波；全局 16 支撑 3 人并发
      # （3×8=24 需求 > 16 供给，公平调度器按任务轮转，每人约 5 路不饿死）。
      # 上限受 DashScope 账号额度约束，不是本机资源——出现 rate_limited=true
      # 就先降回 12，否则 429 会把"慢"换成"识别失败转人工"。
      REVIEW_MODEL_GLOBAL_CONCURRENCY: "${REVIEW_MODEL_GLOBAL_CONCURRENCY:-16}"
      REVIEW_MODEL_JOB_CONCURRENCY: "${REVIEW_MODEL_JOB_CONCURRENCY:-8}"
      # 汇总侧保持 2：通用审核图处理识别结果，
      # 2 核上再提只会互相抢核，吞吐不涨。
      REVIEW_FINALIZE_CONCURRENCY: "${REVIEW_FINALIZE_CONCURRENCY:-2}"
      # 按天或大小轮转；归档数量封顶。文件写进挂载卷，根文件系统保持只读。
      REVIEW_LOG_DIR: "/logs"
      REVIEW_LOG_REQUIRED: "true"
      REVIEW_LOG_LEVEL: "${REVIEW_LOG_LEVEL:-INFO}"
      REVIEW_LOG_MAX_MB: "${REVIEW_LOG_MAX_MB:-10}"
      REVIEW_LOG_BACKUP_COUNT: "${REVIEW_LOG_BACKUP_COUNT:-30}"
      # 车型只读离线目录；容器不需要源数据库地址或账号。
      REVIEW_MODEL_CATALOG_PATH: "/catalog/vehicle-model-catalog.sqlite"
    volumes:
      # 与发布包同目录，排查时 cd 一次就能同时看到 tar 和日志。
      # 写权限由 deploy/start-review.sh 准备——容器用户和 ubuntu 不是同一个 uid。
      - ${REVIEW_UPLOAD_DIR:-/home/ubuntu/review-agent-deploy}/logs:/logs:rw
      - ${REVIEW_MODEL_CATALOG_DIR:-/home/ubuntu/review-agent-deploy/vehicle-model-catalog}:/catalog:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "18110:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
