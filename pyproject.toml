[project]
name = "forj-review-assistant"
version = "0.1.0"
description = "审核辅助 Agent 服务"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "pydantic>=2.13.4",
    "zxing-cpp>=2.3,<3",
    "uvicorn>=0.52.4",
    "langgraph-checkpoint-sqlite>=3,<4",
    "filelock>=3.20,<4",
    "pillow>=12,<13",
    "pymysql>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[project.scripts]
forj-review-assistant = "forj_review_assistant.interfaces.cli:main"
forj-configuration-agent = "forj_configuration_agent.interfaces.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/.env", "**/.env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/forj_review_assistant", "src/forj_configuration_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
